<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Suyu-Signal 지도 & 날씨</title>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=발급받은_자바스크립트_키_입력"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info-panel { 
            position: absolute; top: 10px; left: 10px; z-index: 10; 
            background: rgba(255, 255, 255, 0.9); padding: 15px; 
            border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); 
        }
        #weather-info { margin-top: 10px; font-weight: bold; color: #0052CC; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h3>수유 신호등 프로젝트</h3>
        <div id="weather-info">날씨 불러오는 중...</div>
    </div>
    
    <div id="map"></div>

    <script>
        const lat = 37.6254;
        const lng = 127.0370;

        // 1. 지도 설정
        const map = new kakao.maps.Map(document.getElementById('map'), {
            center: new kakao.maps.LatLng(lat, lng),
            level: 3
        });

        // 2. 버스 마커 설정
        const busIconSvg = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjMDA1MkNDIiBkPSJNNDg4IDEyOEg0MGMtMjIuMSAwLTQwIDE3LjktNDAgNDB2MjU2YzAgMjIuMSAxNy45IDQwIDQwIDQwaDQ0OGMyMi41IDAgNDAtMTcuOSA0MC00MFYxNjhjMC0yMi4xLTE3LjktNDAtNDAtNDB6TTEyOCAzNTJjLTE3LjcgMC0zMi0xNC4zLTMyLTMyczE0LjMtMzIgMzItMzIgMzIgMTQuMyAzMiAzMi0xNC4zIDMyLTMyIDMyem0yNTYgMGMtMTcxIDAtMzItMTQuMy0zMi0zMnMxNC4zLTMyIDMyLTMyIDMyIDE0LjMgMzIgMzItMTQuMyAzMi0zMiAzMnoiLz48L3N2Zz4=`;
        const busMarkerImage = new kakao.maps.MarkerImage(busIconSvg, new kakao.maps.Size(35, 35));

        // 3. 날씨 정보 가져오기 함수
        async function loadWeather() {
            try {
                const res = await fetch(`/api/weather?lat=${lat}&lng=${lng}`);
                const data = await res.json();
                const temp = data.main.temp;
                const desc = data.weather[0].description;
                document.getElementById('weather-info').innerText = `🌡️ 현재 기온: ${temp}°C (${desc})`;
            } catch (e) {
                document.getElementById('weather-info').innerText = "날씨 정보 실패";
            }
        }

        // 4. 정류장 마커 가져오기
        async function loadStations() {
            const res = await fetch(`/api/stations?lat=${lat}&lng=${lng}`);
            const data = await res.json();
            data.documents.forEach(station => {
                new kakao.maps.Marker({
                    map: map,
                    position: new kakao.maps.LatLng(station.y, station.x),
                    image: busMarkerImage,
                    title: station.place_name
                });
            });
        }

        // 실행
        loadWeather();
        loadStations();
    </script>
</body>
</html>
