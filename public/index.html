<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Suyu-Signal 통합</title>
    <!-- ⚠️ 본인의 JavaScript 키로 교체 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bd28b2384c551798f2ab4cd0b9f511a1&libraries=services"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; position: relative; }
        .info-panel { position: absolute; top: 10px; left: 10px; z-index: 100; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .timer-box { padding: 5px 10px; border-radius: 20px; color: white; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3 style="margin:0">수유 신호등 프로젝트</h3>
        <div id="weather">날씨 로딩 중...</div>
    </div>
    <div id="map"></div>

    <script>
        // 카카오 지도 로드 보장
        kakao.maps.load(function() {
            const MY_LAT = 37.6254, MY_LNG = 127.0370;
            const container = document.getElementById('map');
            const options = { center: new kakao.maps.LatLng(MY_LAT, MY_LNG), level: 3 };
            const map = new kakao.maps.Map(container, options);

            // 버스 아이콘 설정
            const busIcon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjMDA1MkNDIiBkPSJNNDg4IDEyOEg0MGMtMjIuMSAwLTQwIDE3LjktNDAgNDB2MjU2YzAgMjIuMSAxNy45IDQwIDQwIDQwaDQ0OGMyMi4xIDAgNDAtMTcuOSA0MC00MFYxNjhjMC0yMi4xLTE3LjktNDAtNDAtNDB6TTEyOCAzNTJjLTE3LjcgMC0zMi0xNC4zLTMyLTMyczE0LjMtMzIgMzItMzIgMzIgMTQuMyAzMiAzMi0xNC4zIDMyLTMyIDMyem0yNTYgMGMtMTcxIDAtMzItMTQuMy0zMi0zMnMxNC4zLTMyIDMyLTMyIDMyIDE0LjMgMzIgMzItMTQuMyAzMi0zMiAzMnoiLz48L3N2Zz4=";
            const busImg = new kakao.maps.MarkerImage(busIcon, new kakao.maps.Size(35, 35));

            let signalOverlays = [];

            // 1. 날씨 로드
            async function loadWeather() {
                try {
                    const res = await fetch(`/api/weather?lat=${MY_LAT}&lng=${MY_LNG}`);
                    const data = await res.json();
                    document.getElementById('weather').innerText = `🌡️ ${Math.round(data.main.temp)}°C / ${data.weather[0].description}`;
                } catch (e) { console.error("날씨 실패", e); }
            }

            // 2. 신호등 타이머 로드 (지도 위에 그리기)
            async function loadSignals() {
                try {
                    const res = await fetch('/api/signal');
                    const data = await res.json();
                    const rows = data.SptTrafficLghtResidTime.row;

                    // 기존 오버레이 삭제
                    signalOverlays.forEach(o => o.setMap(null));
                    signalOverlays = [];

                    rows.forEach(s => {
                        const color = s.LGHT_COL_CD === "1" ? "#00E676" : "#FF1744";
                        const content = `<div class="timer-box" style="background:${color}">${s.RESID_TIME}s</div>`;
                        
                        const overlay = new kakao.maps.CustomOverlay({
                            map: map,
                            position: new kakao.maps.LatLng(s.LAT, s.LNG),
                            content: content,
                            yAnchor: 1.5
                        });
                        signalOverlays.push(overlay);
                    });
                } catch (e) { console.error("신호 실패", e); }
            }

            // 3. 버스 정류장 로드
            async function loadStations() {
                try {
                    const res = await fetch(`/api/stations?lat=${MY_LAT}&lng=${MY_LNG}`);
                    const data = await res.json();
                    data.documents.forEach(p => {
                        new kakao.maps.Marker({
                            map: map,
                            position: new kakao.maps.LatLng(p.y, p.x),
                            image: busImg,
                            title: p.place_name
                        });
                    });
                } catch (e) { console.error("정류소 실패", e); }
            }

            // 실행 및 주기적 업데이트
            loadWeather();
            loadStations();
            loadSignals();
            setInterval(loadSignals, 1000); // 1초마다 타이머 갱신
        });
    </script>
</body>
</html>
